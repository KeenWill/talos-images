# Apply only after a worker boots the Kata-enabled image and its runtime is checked.
# Label only checked workers homelab.keenwill.io/kata-gates=true.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-gates
handler: kata
overhead:
  podFixed:
    # Sidero's release-1.12 example; estimate, not a measured gate footprint.
    memory: 130Mi
    cpu: 250m
scheduling:
  nodeSelector:
    homelab.keenwill.io/kata-gates: "true"
