name: Release

# Publishing a GitHub release (tag vX.Y.Z-rN, the Talos version shapes.yaml
# pins plus a revision) builds each shape's installer from the tagged commit,
# pushes it to ghcr.io/keenwill/talos-images/<shape>-installer:<tag>, records
# build provenance for its digest, and attaches release.yaml, the manifest
# the cluster config pins, with provenance of its own. Only people with write
# access can publish a release; the jobs run on ephemeral cluster runners.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  shapes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: cluster-talos-images
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      installer-shapes: ${{ steps.shapes.outputs.installer-shapes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-yq
      - name: Check the tag and list the shapes with an installer
        id: shapes
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ./release-manifest.sh --check-tag "$TAG"
          echo "installer-shapes=$(yq -o json -I0 '[.shapes | to_entries[] | select(.value.localInputs != true) | select(.value.outputs[] == "installer") | .key]' shapes.yaml)" >>"$GITHUB_OUTPUT"

  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: shapes
    runs-on: cluster-talos-images
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        shape: ${{ fromJSON(needs.shapes.outputs.installer-shapes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-yq
      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the installer
        id: push
        env:
          SHAPE: ${{ matrix.shape }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          UPGRADE_IMAGE="ghcr.io/keenwill/talos-images/${SHAPE}-installer:${TAG}" ./build.sh "$SHAPE" installer
          reference="$(<"_out/${SHAPE}/installer.ref")"
          image="${reference%@*}"
          {
            echo "name=${image%:*}"
            echo "digest=${reference#*@}"
          } >>"$GITHUB_OUTPUT"
          cp "_out/${SHAPE}/installer.ref" "${SHAPE}.ref"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-ref-${{ matrix.shape }}
          path: ${{ matrix.shape }}.ref
          if-no-files-found: error
          retention-days: 1

  manifest:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: publish
    runs-on: cluster-talos-images
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-yq
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installer-ref-*
          merge-multiple: true
          path: installer-refs
      - name: Write release.yaml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          installers=()
          for file in installer-refs/*.ref; do
            shape="${file##*/}"
            installers+=("${shape%.ref}=$(<"$file")")
          done
          ./release-manifest.sh "$TAG" "$GITHUB_SHA" "${installers[@]}" >release.yaml
          cat release.yaml >>"$GITHUB_STEP_SUMMARY"
      # A release asset can be replaced by anyone with write access; the
      # cluster's pin script accepts release.yaml only with this provenance.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release.yaml
      - name: Attach release.yaml
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release.yaml --clobber --repo "$GITHUB_REPOSITORY"
